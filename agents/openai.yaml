interface:
  display_name: "Easy Coding"
  short_description: "七阶段人机共创编程助手，支持 Spec 驱动、项目记忆和保守迭代"
  default_prompt: "使用 $easy-coding，先扫描当前项目与 `.easy-coding` 资产，给出实施级技术方案，并在用户确认后再执行代码修改。固定全局输入仍只包含 Architect-Spec、Product-Spec、UI-Spec 与 Prototype；若扫描到 `.easy-coding/spec/dev/` 下的 Dev-Spec 候选文件，只列出候选并显式询问用户是否加载，支持选择 1 个、多个或全选，不自动读取正文。用户选定后，所选 Dev-Spec 集合仅对当前需求全程生效，不进入长期资产或后续默认扫描；若用户拒绝加载且当前轮没有足以支撑分析的有效提示词或固定 Spec / Prototype，则直接返回“未识别到用户意图, Easy Coding 已准备好, 请随时向我发问”并退出当前流程。编码时补充必要注释；若用户未指定注释语言，默认使用当前对话语言。"
