interface:
  display_name: "Easy Coding"
  short_description: "仅显式调用的六阶段编程助手，支持 Canonical Spec 共享执行、项目记忆和 With Claude"
  default_prompt: >-
    使用 `$easy-coding` 按六阶段流程处理编程需求，并通过设计摘要与受控 writer 读取、共享和回写 Canonical Spec execution；保留 Legacy、确认门禁、记忆及 With Claude 只读 REVIEW。

policy:
  allow_implicit_invocation: false
